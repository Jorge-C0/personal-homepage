<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BarkerBox - 15% Off</title>
  <!-- Connects this page to our CSS file for styling -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- The white box that holds everything -->
  <div class="form-container">
    <img src="images.jpeg" alt="A happy dog" class="featured-images">

    <!-- Heading with the product name and the offer -->
    <h1>BarkerBox: Get 15% Off!</h1>

    <!-- Short description of the product and the benefits -->
    <p>
      BarkerBox is a monthly subscription box filled with unique, playful,
      and durable toys that dogs will love. Subscribe today and enjoy a fresh
      surprise for your pup every month, delivered right to your door. New
      subscribers get 15% off!
    </p>

    <!-- Registration form -->
    <form action="#" method="post">

      <!-- Label tells the visitor what to type -->
      <label for="email">Your full name and email address</label>

      <!-- "required" means the form can't be sent if this is empty -->
      <input type="text" id="name" name="name" placeholder="full name" required>

      <input type="email" id="email" name="email" placeholder="you@example.com" required>

      <!-- Button that submits the form -->
      <button type="submit">Get My 15% Off</button>

    </form>
  </div>

</body>
</html>
